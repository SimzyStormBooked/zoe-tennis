<style>
*{box-sizing:border-box}
body{margin:0;background:#0a1114;color:#eaf2ed;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;gap:1rem;padding:1.25rem 1rem 2rem;min-height:100vh}
.top{width:100%;max-width:26rem;display:flex;align-items:baseline;justify-content:space-between}
.brand{font-weight:800;font-size:1.05rem;letter-spacing:-.03em;display:flex;align-items:baseline;gap:.4rem}
.brand i{width:.34rem;height:.34rem;border-radius:999px;background:#bfe155;display:block;transform:translateY(-.1rem)}
.top .n{font-size:.7rem;color:#7d908a}
.reel{position:relative;width:100%;max-width:26rem;aspect-ratio:9/16;border-radius:1.1rem;overflow:hidden;background:#06151a;isolation:isolate;box-shadow:0 18px 50px rgb(0 0 0/.45);user-select:none}
.tone{position:absolute;inset:0;z-index:0}
.t-court{background:radial-gradient(circle at 78% 12%,rgb(134 173 28/.30),transparent 32%),linear-gradient(150deg,#17708a 0%,#0e4a5e 44%,#051b23 100%)}
.t-gold{background:radial-gradient(circle at 20% 10%,rgb(236 201 106/.36),transparent 34%),linear-gradient(155deg,#9a6f1c 0%,#503407 48%,#130d02 100%)}
.t-optic{background:radial-gradient(circle at 74% 14%,rgb(191 225 85/.40),transparent 32%),linear-gradient(150deg,#617f11 0%,#27410a 46%,#091403 100%)}
.t-dusk{background:radial-gradient(circle at 78% 8%,rgb(193 121 255/.24),transparent 33%),linear-gradient(155deg,#33427a 0%,#182146 45%,#070b1c 100%)}
.photo{position:absolute;inset:0;z-index:1;background-size:cover;background-position:56% 40%;opacity:.5}
.lines{position:absolute;inset:32% -14% -22% -14%;z-index:2;opacity:.2;pointer-events:none;background-image:linear-gradient(90deg,transparent 49.6%,#fff 49.6%,#fff 50.4%,transparent 50.4%),linear-gradient(transparent 46%,#fff 46%,#fff 46.6%,transparent 46.6%);transform:perspective(30rem) rotateX(60deg) scale(1.4) translateY(12%);transform-origin:center bottom}
.scrim{position:absolute;inset:0;z-index:3;background:linear-gradient(to top,rgb(3 12 15/.86) 0%,rgb(3 12 15/.3) 46%,rgb(3 12 15/.1) 72%)}
.bars{position:absolute;top:.7rem;left:.7rem;right:.7rem;z-index:6;display:flex;gap:4px}
.bars span{flex:1;height:3px;border-radius:999px;background:rgb(255 255 255/.26);overflow:hidden}
.bars b{display:block;height:100%;width:0;background:#fff;border-radius:999px}
.slide{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:flex-end;padding:1.35rem 1.3rem 1.5rem;color:#fff}
.eyebrow{font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.16em;color:rgb(255 255 255/.66);margin:0}
.metric{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600;font-size:clamp(3rem,16vw,4.4rem);line-height:.9;letter-spacing:-.03em;margin:.85rem 0 0;font-variant-numeric:tabular-nums}
.mlabel{font-size:.72rem;text-transform:uppercase;letter-spacing:.13em;color:#bfe155;margin:.45rem 0 0;font-weight:600}
.head{font-weight:800;font-size:clamp(1.5rem,7vw,2rem);line-height:1.09;letter-spacing:-.025em;margin:1rem 0 0;text-wrap:balance}
.detail{font-size:.88rem;line-height:1.55;margin:.6rem 0 0;color:rgb(255 255 255/.78);max-width:30ch;padding-right:.5rem}
.tap{position:absolute;inset:0;z-index:7;display:flex}
.tap button{flex:1;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap button:focus-visible{outline:2px solid #bfe155;outline-offset:-6px}
.tools{position:absolute;z-index:8;right:.7rem;top:1.5rem;display:flex;gap:.45rem}
.tools button{width:2.3rem;height:2.3rem;border-radius:999px;border:1px solid rgb(255 255 255/.2);background:rgb(4 13 16/.42);color:#fff;cursor:pointer;font-size:.8rem;display:grid;place-items:center}
.tools button:focus-visible{outline:2px solid #bfe155;outline-offset:2px}
.enter{animation:rise 520ms cubic-bezier(.2,.82,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.cap{width:100%;max-width:26rem;font-size:.78rem;line-height:1.6;color:#a2b6af}
.cap b{color:#eaf2ed}
@media (prefers-reduced-motion:reduce){.enter{animation:none}}

var g=function(id){return document.getElementById(id)};
var bars=S.map(function(){var s=document.createElement('span'),b=document.createElement('b');s.appendChild(b);g('bars').appendChild(s);return b});
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(anim){
  var s=S[i];
  g('tone').className='tone t-'+s.tone;
  g('photo').style.backgroundImage=s.photo?'url("'+s.photo+'")':'none';
  g('eyebrow').textContent=s.eyebrow;
  g('metric').textContent=s.metric;
  g('mlabel').textContent=s.metricLabel;
  g('head').textContent=s.headline;
  g('detail').textContent=s.detail;
  if(anim&&!reduce){var n=g('slide');n.classList.remove('enter');void n.offsetWidth;n.classList.add('enter')}
  bars.forEach(function(b,k){b.style.width=k<i?'100%':'0%'});
}
function go(n,anim){i=(n+S.length)%S.length;el=0;draw(anim!==false)}
function tick(now){
  var dt=Math.min(now-last,120);last=now;
  if(!paused){
    el+=dt;bars[i].style.width=Math.min(100,el/MS*100)+'%';
    if(el>=MS){ if(i===S.length-1){paused=true;g('pause').innerHTML='&#9654;'} else {go(i+1)} }
  }
  requestAnimationFrame(tick);
}
g('next').onclick=function(){go(i+1)};
g('prev').onclick=function(){go(i-1)};
g('pause').onclick=function(e){e.stopPropagation();paused=!paused;g('pause').innerHTML=paused?'&#9654;':'&#10074;&#10074;'};
g('again').onclick=function(e){e.stopPropagation();paused=false;g('pause').innerHTML='&#10074;&#10074;';go(0)};
g('reel').onkeydown=function(e){
  if(e.key==='ArrowRight'){go(i+1);e.preventDefault()}
  if(e.key==='ArrowLeft'){go(i-1);e.preventDefault()}
  if(e.key===' '){g('pause').click();e.preventDefault()}
};
document.addEventListener('visibilitychange',function(){if(!document.hidden)last=performance.now()});
draw(false);
requestAnimationFrame(function(t){last=t;requestAnimationFrame(tick)});
})();
